# Crée une release GitHub numérotée JJ.MM.AAAA-X-0 :
# X compte les releases du jour (à partir de 1), le dernier chiffre reste à 0.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Créer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          day=$(TZ=Europe/Paris date +%d.%m.%Y)
          count=$(gh api "repos/$REPO/tags" --paginate --jq '.[].name' | grep -c "^$day-" || true)
          version="$day-$((count + 1))-0"
          echo "Version : $version"
          gh release create "$version" --repo "$REPO" --target "$SHA" --title "$version" --generate-notes
          echo "### Release $version créée" >> "$GITHUB_STEP_SUMMARY"
